<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemački kviz - kompletna baza reči (700+)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e2b3a, #2c3e4e);
    min-height: 100vh;
    padding: 20px;
    color: #f2e9d0;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 {
    font-size: 1.9rem;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #f2e9d0;
    border-bottom: 2px solid rgba(217,179,130,0.25);
    padding-bottom: 12px;
    flex-wrap: wrap;
  }
  h1 span {
    background: #d9b382;
    color: #1e2b3a;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 30px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    padding: 12px 20px;
    border-radius: 40px;
    margin: 18px 0;
    font-size: 1rem;
    flex-wrap: wrap;
    gap: 10px;
  }
  .score {
    background: #d9b382;
    color: #1e2b3a;
    padding: 4px 16px;
    border-radius: 30px;
    font-weight: 700;
  }
  .question {
    background: rgba(255,255,255,0.05);
    border-left: 6px solid #d9b382;
    padding: 22px 24px;
    border-radius: 18px;
    font-size: 1.35rem;
    font-weight: 500;
    margin-bottom: 22px;
    line-height: 1.4;
    color: #fff5e6;
    word-break: break-word;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .options { grid-template-columns: 1fr; }
    .question { font-size: 1.1rem; }
    h1 { font-size: 1.4rem; }
  }
  .option {
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(217,179,130,0.3);
    border-radius: 14px;
    padding: 14px;
    font-size: 1.05rem;
    color: #e8eef3;
    cursor: pointer;
    transition: 0.15s;
    text-align: center;
    font-family: inherit;
    word-break: break-word;
  }
  .option:hover:not(.disabled) {
    background: rgba(217,179,130,0.2);
    border-color: #d9b382;
    transform: scale(1.01);
  }
  .option.correct {
    background: #3f8e5c;
    border-color: #7ed49b;
    color: white;
    font-weight: 600;
  }
  .option.wrong {
    background: #b2453a;
    border-color: #e07b70;
    color: white;
  }
  .option.disabled { pointer-events: none; opacity: 0.85; }
  .feedback {
    text-align: center;
    font-size: 1.15rem;
    padding: 14px;
    border-radius: 30px;
    background: rgba(0,0,0,0.3);
    margin-bottom: 16px;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .next {
    width: 100%;
    padding: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    background: #d9b382;
    color: #1e2b3a;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
  }
  .next:hover:not(:disabled) {
    background: #e6c9a2;
    transform: translateY(-2px);
  }
  .next:disabled {
    background: #7b8c9c;
    color: #cfdde8;
    cursor: not-allowed;
    transform: none;
  }
  .finish {
    text-align: center;
    padding: 30px 10px;
  }
  .finish h2 {
    font-size: 2.2rem;
    margin-bottom: 16px;
    color: #d9b382;
  }
  .finish p {
    font-size: 1.4rem;
    margin-bottom: 26px;
    background: rgba(0,0,0,0.3);
    padding: 16px;
    border-radius: 30px;
    display: inline-block;
  }
  .restart {
    padding: 14px 36px;
    font-size: 1.15rem;
    font-weight: 700;
    background: #d9b382;
    color: #1e2b3a;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    font-family: inherit;
    margin-right: 8px;
  }
  .restart:hover { background: #e6c9a2; }
  .hidden { display: none; }
  .info {
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.75;
    margin-top: 18px;
  }
  .level-tag {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(217,179,130,0.3);
    color: #f2e9d0;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="container" id="app">

  <div id="quizView">

    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback">Izaberi odgovor</div>
    <button class="next" id="nextBtn" disabled>Sledeće pitanje →</button>
    <div class="info">
      Nasumično izabrano <span id="numQuestions">20</span> pitanja iz baze od
      <span id="totalQuestions">0</span> reči / izraza

  </div>

    <p id="finalScore">Osvojili ste 0 / 20</p><br>
    <button class="restart" id="restartBtn">🔄 Novi kviz</button>

</div>

  { q: "die Notwendigkeit", c: "neophodnost", w: ["nepotreba", "suvišnost", "opcionost"] },
  { q: "der Zufall", c: "slučajnost", w: ["namera", "plan", "cilj"] },
  { q: "das Schicksal", c: "sudbina", w: ["slučajnost", "izbor", "odluka"] },
  { q: "die Zukunft", c: "budućnost", w: ["prošlost", "sadašnjost", "sada"] },
  { q: "die Vergangenheit", c: "prošlost", w: ["budućnost", "sadašnjost", "sada"] },
  { q: "die Gegenwart", c: "sadašnjost", w: ["prošlost", "budućnost", "sada"] },
];

/* =====================================================================
   LOGIKA KVIZA
   ===================================================================== */
const BROJ_PITANJA = 20; // promeni na željeni broj pitanja

let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const questionCounter = document.getElementById('questionCounter');
const scoreDisplay = document.getElementById('scoreDisplay');
const quizView = document.getElementById('quizView');
const finishView = document.getElementById('finishView');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const totalQuestionsSpan = document.getElementById('totalQuestions');
const numQuestionsSpan = document.getElementById('numQuestions');

totalQuestionsSpan.textContent = wordDatabase.length;
numQuestionsSpan.textContent = BROJ_PITANJA;

// Fisher-Yates shuffle
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Priprema kviza - nasumično bira N reči i meša odgovore
function prepareQuiz() {
  const shuffled = shuffle(wordDatabase);
  // Osiguravamo da nema duplikata pitanja
  const seen = new Set();
  const selected = [];
  for (const word of shuffled) {
    if (!seen.has(word.q)) {
      seen.add(word.q);
      selected.push(word);
    }
    if (selected.length >= BROJ_PITANJA) break;
  }
  quizQuestions = selected.map(word => {
    const allOptions = shuffle([word.c, ...word.w]);
    return {
      question: word.q,
      options: allOptions,
      correctIndex: allOptions.indexOf(word.c)
    };
  });
}

function loadQuestion() {
  const q = quizQuestions[currentIndex];
  questionText.textContent = q.question;
  questionCounter.textContent = `Pitanje ${currentIndex + 1} / ${BROJ_PITANJA}`;
  scoreDisplay.textContent = score;

  answered = false;
  nextBtn.disabled = true;
  feedback.textContent = 'Izaberi odgovor';
  feedback.style.background = 'rgba(0,0,0,0.3)';
  feedback.style.color = '#f2e9d0';

  optionsContainer.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(idx, btn));
    optionsContainer.appendChild(btn);
  });
}

function handleAnswer(selectedIdx, btnEl) {
  if (answered) return;
  answered = true;

  const q = quizQuestions[currentIndex];
  const allBtns = document.querySelectorAll('.option');
  allBtns.forEach(b => b.classList.add('disabled'));

  allBtns.forEach((b, idx) => {
    if (idx === q.correctIndex) b.classList.add('correct');
    else if (idx === selectedIdx) b.classList.add('wrong');
  });

  if (selectedIdx === q.correctIndex) {
    score++;
    scoreDisplay.textContent = score;
    feedback.textContent = '✅ Tačno!';
    feedback.style.background = '#2a5e3a';
    feedback.style.color = '#fff';
  } else {
    feedback.textContent = `❌ Netačno. Tačan odgovor: ${q.options[q.correctIndex]}`;
    feedback.style.background = '#6d2e2a';
    feedback.style.color = '#fff';
  }

  nextBtn.disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  if (currentIndex < BROJ_PITANJA - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    quizView.classList.add('hidden');
    finishView.classList.remove('hidden');
    finalScore.textContent = `Osvojili ste ${score} / ${BROJ_PITANJA} poena`;
  }
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  answered = false;
  prepareQuiz();
  quizView.classList.remove('hidden');
  finishView.classList.add('hidden');
  loadQuestion();
}

nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', restartQuiz);

// Start
prepareQuiz();
loadQuestion();
</script>
</body>
</html>
