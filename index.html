<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 Kvizovi — Index</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a3093 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 520px;
    padding: 40px 35px;
  }
  h1 {
    text-align: center;
    color: #1e3c72;
    font-size: 1.8rem;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 0.95rem;
    margin-bottom: 30px;
  }
  .btn-list {
    display: grid;
    gap: 14px;
  }
  .quiz-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #1e3c72;
    background: #f4f7fb;
    border: 2px solid #d0d7e2;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.25s ease;
    text-decoration: none;
    font-family: inherit;
  }
  .quiz-btn:hover {
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    color: #fff;
    border-color: #1e3c72;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(30, 60, 114, 0.35);
  }
  .quiz-btn:hover .icon {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    background: #e1e9f5;
    border-radius: 10px;
    font-size: 1.3rem;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }
  .arrow {
    margin-left: auto;
    font-size: 1.2rem;
    opacity: 0.5;
    transition: all 0.25s ease;
  }
  .quiz-btn:hover .arrow {
    opacity: 1;
    transform: translateX(4px);
  }
  footer {
    text-align: center;
    margin-top: 25px;
    font-size: 0.8rem;
    color: #aaa;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📚 B1 Kvizovi</h1>
  <p class="subtitle">Izaberi kviz koji želiš da otvoriš</p>

  <div class="btn-list">
    <button class="quiz-btn" onclick="openQuiz('B1 - 15.html')">
      <span class="icon">📝</span>
      <span>B1 - 15</span>
      <span class="arrow">→</span>
    </button>

    <button class="quiz-btn" onclick="openQuiz('B1 - 16.html')">
      <span class="icon">📝</span>
      <span>B1 - 16</span>
      <span class="arrow">→</span>
    </button>

    <button class="quiz-btn" onclick="openQuiz('B1 - 17.html')">
      <span class="icon">📝</span>
      <span>B1 - 17</span>
      <span class="arrow">→</span>
    </button>

    <button class="quiz-btn" onclick="openQuiz('B1 - 18.html')">
      <span class="icon">📝</span>
      <span>B1 - 18</span>
      <span class="arrow">→</span>
    </button>
  </div>

  <footer>Klikom na dugme otvara se kviz u novom tabu</footer>
</div>

<script>
  function openQuiz(filename) {
    window.open(filename, '_blank');
  }
</script>
</body>
</html>
